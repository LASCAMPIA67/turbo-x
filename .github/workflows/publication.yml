# Publie une version quand une étiquette vX.Y.Z est envoyée : vérifie, fabrique, atteste, publie.
name: Publication

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    name: Publier la version
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write      # créer la publication
      id-token: write      # signer l'attestation de provenance
      attestations: write  # enregistrer l'attestation
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier (la version du script doit être celle de l'étiquette)
        run: ./outils/verifier.ps1 -Etiquette $env:GITHUB_REF_NAME

      - name: Fabriquer TurboX.exe et l'archive
        run: ./outils/compiler.ps1

      - name: Attester la provenance des fichiers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/TurboX.exe
            dist/TurboX-*.zip

      - name: Publier sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./outils/notes-version.ps1 -Version $version | Set-Content -LiteralPath notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME dist/TurboX.exe "dist/TurboX-$version.zip" dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --title "Turbo X $version" --notes-file notes.md --verify-tag
